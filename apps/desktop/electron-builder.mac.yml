appId: com.lnwjud.desktop
productName: lnwjud
asar: true
npmRebuild: false
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: engasnm111
  repo: lnwjud
  releaseType: release
extraResources:
  - from: build/runtime-tools
    to: runtime-tools
extraFiles:
  - from: build/lnwjud-mcp-stdio.cjs
    to: MacOS/lnwjud-mcp-stdio.cjs
  - from: build/lnwjud-mcp-stdio
    to: MacOS/lnwjud-mcp-stdio
  - from: build/lnwjud-node
    to: MacOS/lnwjud-node
  - from: build/lnwjud-macos-helper
    to: MacOS/lnwjud-macos-helper
  - from: ../../.agents/skills/lnwjud-scheduled-continuation
    to: Resources/agent-skills/lnwjud-scheduled-continuation
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  # macOS 15 (Sequoia) is the supported floor for this Apple-Silicon build.
  extendInfo:
    LSMinimumSystemVersion: '15.0'
  target:
    - target: dmg
    - target: zip
  artifactName: lnwjud-${version}-mac-${arch}.${ext}
